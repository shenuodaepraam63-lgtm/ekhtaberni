name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Resolve env and build
        run: |
          # Prefer secrets, fall back to vars (you mixed both)
          export VITE_SUPABASE_URL="${SECRET_URL:-$VAR_URL}"
          export VITE_SUPABASE_ANON_KEY="${SECRET_KEY:-$VAR_KEY}"
          export VITE_ADMIN_EMAIL="${SECRET_ADMIN:-$VAR_ADMIN}"

          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: missing Supabase config"
            echo "SECRET_URL length: ${#SECRET_URL}"
            echo "VAR_URL length: ${#VAR_URL}"
            echo "SECRET_KEY length: ${#SECRET_KEY}"
            echo "VAR_KEY length: ${#VAR_KEY}"
            echo "Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under:"
            echo "Settings → Environments → github-pages → Environment secrets (preferred)"
            exit 1
          fi

          echo "URL length: ${#VITE_SUPABASE_URL}"
          echo "KEY length: ${#VITE_SUPABASE_ANON_KEY}"
          npm run build
        env:
          SECRET_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SECRET_ADMIN: ${{ secrets.VITE_ADMIN_EMAIL }}
          VAR_URL: ${{ vars.VITE_SUPABASE_URL }}
          VAR_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VAR_ADMIN: ${{ vars.VITE_ADMIN_EMAIL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
